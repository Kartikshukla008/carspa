version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: carwash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carwash_db}
      POSTGRES_USER: ${POSTGRES_USER:-carwash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carwash_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash_user -d carwash_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carwash_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-production-ready-secret-key-123}
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-carwash_user}:${POSTGRES_PASSWORD:-carwash_secret_password}@db:5432/${POSTGRES_DB:-carwash_db}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-False}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carwash_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
